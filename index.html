<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2c2e33">
  <meta name="description" content="Natural-display scientific calculator for your phone. Works offline.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="fx-85 PLUS">
  <meta name="format-detection" content="telephone=no">
  <title>fx-85 PLUS Calculator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="calc">
    <header class="faceplate">
      <span class="brand">SCIENTIFIC</span>
      <span class="model">fx-85<small>PLUS</small></span>
    </header>
    <div class="lcd-bezel">
      <canvas id="lcd" role="img" aria-label="Calculator display"></canvas>
      <div id="lcd-text" class="sr-only" aria-live="polite"></div>
    </div>
    <div class="subplate"><span>NATURAL DISPLAY</span><span class="grille"></span></div>
    <section id="keys" aria-label="Keypad"></section>
  </main>
  <noscript><p class="noscript">This calculator needs JavaScript.</p></noscript>
</body>
</html>
